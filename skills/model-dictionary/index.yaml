# Model dictionary index
# Hand-maintained; tests/test_doc_consistency.py checks it against entries/.
# Total entries: 30
#
# verified_status levels are defined in skills/model-dictionary/SKILL.md (Verification status).
# verified.pdf_location in each entry records the local filename at
# verification time; PDFs are not distributed (see papers/README.md).
#
# Verification is best-effort, not infallible. Treat "verified" as
# "checked against the paper", not as a guarantee; report suspected errors.

entries:

