# Paper-target validation for Litterman 1986 BVAR replication.
#
# Litterman (1986, "Forecasting with Bayesian Vector Autoregressions—Five
# Years of Experience", JBES 4(1), 25-38) reports a 7-variable QUARTERLY BVAR
# (real GNP growth, GNP-deflator inflation, unemployment, M1, investment,
# commercial-paper rate, change in business inventories; six lags; 1948-1979).
# Headline (Table 2, p. 30): imposing the Minnesota prior improves forecasts
# at all horizons relative to the unrestricted VAR, for every variable.
#
# Targets below mix (a) the paper's qualitative claim that the BVAR beats
# the unrestricted VAR out-of-sample, and (b) a numerical baseline from an
# earlier run (1959Q1-2019Q4 OOS demonstration) as a regression check.

targets:
  # ---- Headline counts ----
  - description: "Number of cells where BVAR beats unrestricted VAR (out of 28)"
    location: "Litterman 1986 p. 31 (Table 2, p. 30): the prior beats no-prior for every variable at all horizons (paper: 7 variables x 8 horizons, Theil coefficients, 1971-75); 28 = this run's 7 x 4 OOS cell grid"
    paper_value: 28.0
    paper_units: "count of (variable, horizon) cells out of 28"
    our_key: "n_bvar_wins"
    tolerance: 3.0
    tolerance_kind: "absolute"

  - description: "DM-significant cells at p<0.10 (out of 28)"
    location: "Our earlier OOS run regression baseline (Diebold-Mariano, squared-error loss; step=1 consecutive quarterly origins, matched cells)"
    paper_value: 21.0
    paper_units: "count of (variable, horizon) cells out of 28"
    our_key: "n_dm_significant"
    tolerance: 5.0
    tolerance_kind: "absolute"

  # ---- Key per-cell RMSE ratios (earlier-run regression baselines) ----
  # Wide tolerances: "is the replication still roughly working?" not exact repro.

  - description: "RMSE ratio rgnp (real GNP growth) @ h=4 (BVAR/unrestricted VAR)"
    location: "Earlier OOS run (step=1, matched cells); < 1 means BVAR wins"
    paper_value: 0.46
    paper_units: "ratio; < 1 means BVAR wins"
    our_key: "rmse_ratio_rgnp_h4"
    tolerance: 0.20
    tolerance_kind: "absolute"

  - description: "RMSE ratio cprate (commercial paper rate) @ h=4 (BVAR/unrestricted VAR)"
    location: "Earlier OOS run; < 1 means BVAR wins"
    paper_value: 0.46
    paper_units: "ratio; < 1 means BVAR wins"
    our_key: "rmse_ratio_cprate_h4"
    tolerance: 0.20
    tolerance_kind: "absolute"

  - description: "RMSE ratio invest (gross private domestic investment) @ h=4 (BVAR/unrestricted VAR)"
    location: "Earlier OOS run; < 1 means BVAR wins"
    paper_value: 0.60
    paper_units: "ratio; < 1 means BVAR wins"
    our_key: "rmse_ratio_invest_h4"
    tolerance: 0.20
    tolerance_kind: "absolute"

  - description: "RMSE ratio urate (unemployment) @ h=8 (BVAR/unrestricted VAR)"
    location: "Earlier OOS run; < 1 means BVAR wins"
    paper_value: 0.68
    paper_units: "ratio; < 1 means BVAR wins"
    our_key: "rmse_ratio_urate_h8"
    tolerance: 0.20
    tolerance_kind: "absolute"

  # ---- Model-fit diagnostic ----
  - description: "BVAR max eigenvalue modulus regression check (near-unity expected with delta_i=1; the band admits mildly explosive roots, so this is not a stability test)"
    location: "Model fit; random-walk priors put the posterior near the unit-root boundary"
    paper_value: 1.0
    paper_units: "max|eig|"
    our_key: "max_eigenvalue_modulus"
    tolerance: 0.05
    tolerance_kind: "absolute"
