# Paper-target validation for Blanchard-Quah (1989) replication.
#
# BQ 1989 (AER 79(4), 655-673) introduced the long-run identification scheme
# for distinguishing aggregate supply from aggregate demand shocks in a
# bivariate VAR of GNP growth and unemployment. Headline identifying
# assumption (§I, p. 657): demand shocks have NO long-run effect on the level
# of output; supply shocks may.
#
# Data-treatment note: this replication uses BQ's "case (c)" (raw series +
# VAR constant), one of the alternatives the paper reports as qualitatively
# similar to the base case (p. 662). It was
# adopted after the paper's base case (output-growth break at 1974Q1 +
# detrended unemployment, p. 661) gave a negative permanent supply effect on
# the FRED-QD-truncated proxy sample, so the choice was made with the result
# in view (see README); the base case is not run.
#
# Targets pin the headline identification claim (zero long-run demand effect
# on log GDP) + the qualitative IRF signs + our earlier-run numerical
# baseline. NOTE: the supply->unemployment INITIAL sign is NOT asserted
# here, because the paper's "supply slightly raises U initially" (p. 663)
# is not reproduced on the proxy data (README caveat).

targets:
  - description: "Number of endogenous variables (bivariate VAR)"
    location: "BQ 1989 p. 661: real GNP growth and the unemployment rate"
    paper_value: 2.0
    paper_units: "count"
    our_key: "n_vars"
    tolerance: 0.0
    tolerance_kind: "absolute"

  - description: "Stable VAR (max |eigenvalue| well below 1)"
    location: "Our earlier-run baseline (BQ report no eigenvalues; stationarity is assumed, p. 657)"
    paper_value: 0.86
    paper_units: "modulus"
    our_key: "max_eig_modulus"
    tolerance: 0.10
    tolerance_kind: "absolute"

  - description: "Cumulative supply-shock effect on log GDP at long horizons (positive by BQ's normalisation; magnitude is our earlier-run baseline, case (c))"
    location: "Our earlier run, not a paper value. BQ §IV p. 662: the effect 'cumulates steadily over time' and settles near 0.6 in the base case (Fig. 2); case (c) responses are not shown in the paper"
    paper_value: 1.0
    paper_units: "log-percentage points; sign convention: positive = permanent rise"
    our_key: "cum_supply_log_gdp"
    tolerance: 0.30
    tolerance_kind: "absolute"

  - description: "Cumulative demand-shock effect on log GDP (NEAR ZERO by the BQ identifying assumption)"
    location: "BQ 1989 §I p. 657 restriction: sum_j a11(j)=0, demand has no long-run output effect"
    paper_value: 0.0
    paper_units: "log-percentage points; identifying restriction"
    our_key: "cum_demand_log_gdp"
    tolerance: 0.20
    tolerance_kind: "absolute"

  - description: "Supply shock raises GDP growth on impact (positive)"
    location: "BQ 1989 Fig 2 (response to supply), p. 662-663"
    paper_value: 1.0
    paper_units: "indicator (1.0 = positive)"
    our_key: "supply_h0_gdp_growth_positive"
    tolerance: 0.0
    tolerance_kind: "absolute"

  - description: "Demand shock raises GDP growth on impact (positive)"
    location: "BQ 1989 Fig 1 (response to demand), p. 662-663"
    paper_value: 1.0
    paper_units: "indicator (1.0 = positive)"
    our_key: "demand_h0_gdp_growth_positive"
    tolerance: 0.0
    tolerance_kind: "absolute"
