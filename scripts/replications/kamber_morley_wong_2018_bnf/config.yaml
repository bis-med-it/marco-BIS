# Replication config for Kamber-Morley-Wong (2018) BN filter applied to US
# real GDP. Demonstrates the headline result: imposing a low signal-to-noise
# ratio on the AR(p) for first differences produces a LARGER, more
# persistent, NBER-aligned cycle than the unconstrained Beveridge-Nelson
# decomposition.
#
# Dictionary entry:
#   skills/model-dictionary/entries/kamber_morley_wong_2018_bnf.yaml

replication:
  id: "kamber_morley_wong_2018_bnf"
  title: "Kamber-Morley-Wong (2018) BN Filter"
  subtitle: "Constrained-AR Beveridge-Nelson on US real GDP; delta-bar=0.25 gives the canonical NBER-aligned output gap"

# --- Data ---
data:
  source: "fred_qd"
  sample_start: "1947-01-01"
  sample_end: "2019-12-31"   # pre-COVID; the 2020Q2 outlier dominates the AR fit if included
  series:
    code: "GDPC1"
    transform: "log_x_100"   # log GDP * 100 so cycle units = log-percentage points

# --- Filter parameters ---
filter:
  # KMW use p=12 under their shrinkage prior (unconstrained SIC favours
  # p=1, fn 1; BIC on this data selects a similarly small order). We pin
  # p=12 for reproducibility.
  ar_order: 12
  delta: 0.25                # KMW's delta-bar = psi(1)^2 (=> sum(phi) = -1); rounded from the paper's automatic-selection value 0.24 (p. 554)
  delta_sensitivity: [0.10, 0.25, 0.50, 1.00]   # 1.00 imposes sum(phi)=0 (pure random-walk trend)

# --- NBER recession periods (peak -> trough) covered by the sample.
#     Used to compute average cycle within each recession episode.
#     FRED-QD labels a quarter by its last month, so each window must
#     reach the label of the trough quarter.
nber_recessions:
  - {name: "1948-49 (Truman)",    start: "1948-11-01", end: "1949-10-01"}
  - {name: "1953-54 (Eisenhower)", start: "1953-07-01", end: "1954-04-01"}
  - {name: "1957-58",              start: "1957-07-01", end: "1958-04-01"}
  - {name: "1960-61",              start: "1960-04-01", end: "1961-01-01"}
  - {name: "1969-70",              start: "1969-10-01", end: "1970-12-31"}
  - {name: "1973-75 (oil)",        start: "1973-10-01", end: "1975-04-01"}
  - {name: "1980 (Volcker I)",     start: "1980-01-01", end: "1980-09-30"}
  - {name: "1981-82 (Volcker II)", start: "1981-07-01", end: "1982-12-31"}
  - {name: "1990-91",              start: "1990-07-01", end: "1991-04-01"}
  - {name: "2001 (dotcom)",        start: "2001-01-01", end: "2001-12-31"}
  - {name: "2007-09 (GFC)",        start: "2007-10-01", end: "2009-07-01"}

# --- Out-of-sample Phillips-curve test ---
# Does the BNF gap add predictive content for future inflation over a
# univariate AR benchmark? Compares three forecasting models in an expanding
# window starting from window_size quarters: AR(p_pi) alone, AR(p_pi) + BN
# gap, AR(p_pi) + KMW gap.
#
# The cycle estimates use full-sample information (BN/KMW are in-sample
# decompositions); the Phillips-curve regression coefficients are
# estimated per window. So this is a pseudo-OOS test of the *usefulness*
# of each cycle measure as a predictor, not a strict real-time test.
phillips_curve:
  inflation_source: "fred_qd"
  inflation_code: "GDPCTPI"
  inflation_transform: "log_diff"   # quarterly log-difference of the deflator
  window_size: 60                   # initial (expanding) window: 15 years quarterly
  horizons: [1, 4, 8]               # PC horizons typically reported
  step: 1                           # consecutive quarterly origins; the DM
                                    # truncation/HLN assumes origin spacing
                                    # equals the loss array's period
  ar_lags: 4                        # AR(4) for inflation in the Phillips curve

# --- Reproducibility ---
general:
  random_seed: 42
