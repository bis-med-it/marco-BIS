# Paper-target validation for Sims (1980) replication.
#
# Sims (1980, Econometrica 48(1), 1-48) is the foundational unrestricted-VAR
# paper. Six-variable QUARTERLY VAR(4) of money / real GNP / unemployment /
# wages / price level / import prices, ordered M, Y, U, W, P, PM (paper
# p. 21), each series logged except unemployment, with a constant and time
# trend (p. 18). The paper's headline argument is methodological: VARs as a
# useful descriptive tool, with Cholesky-identified IRFs as the interpretive
# device.
#
# Sample note: paper's US fit period is 1949-75 (p. 18). FRED-QD starts
# 1959Q1, so this replication is truncated to 1959Q1-1975Q4 (68 obs).
#
# Specific empirical claims:
#   1. Monetary shocks (M1 ordered first) raise real output temporarily
#      and the price level persistently (p. 21 (i); p. 22, common
#      element (i)).
#
# Stability: Sims describes his estimated U.S. system as "a very slowly
# damped oscillatory system" (p. 21). In the current run of this
# replication the largest companion root is slightly above one (1.074),
# so the system is mildly explosive in this sample. The max_eig target
# below does not enforce stability.
#
# Targets below mix (a) the paper's qualitative claims with (b)
# numerical baselines from an earlier run of this replication, locked in
# as regression checks (not numbers from the paper).

targets:
  # ---- Structural sanity ----
  - description: "Sample size (number of quarterly observations 1959Q1-1975Q4)"
    location: "FRED-QD-truncated sample; paper p. 18 used 1949-75 (108 obs), FRED-QD floor is 1959Q1 -> 68"
    paper_value: 68.0
    paper_units: "count"
    our_key: "n_obs"
    tolerance: 1.0
    tolerance_kind: "absolute"

  - description: "Effective sample T - p"
    location: "T_eff = T - lags = 68 - 4 = 64"
    paper_value: 64.0
    paper_units: "count"
    our_key: "t_eff"
    tolerance: 1.0
    tolerance_kind: "absolute"

  - description: "Number of endogenous variables"
    location: "Paper p. 18: six data series (money, real GNP, unemployment, wages, price level, import prices)"
    paper_value: 6.0
    paper_units: "count"
    our_key: "n_vars"
    tolerance: 0.0
    tolerance_kind: "absolute"

  - description: "VAR lag order"
    location: "Paper p. 18: tested 4 vs 8 lags, shorter (4) accepted and used"
    paper_value: 4.0
    paper_units: "count"
    our_key: "n_lags"
    tolerance: 0.0
    tolerance_kind: "absolute"

  - description: "Max |eigenvalue| of companion matrix (framework check; the band admits mildly explosive roots)"
    location: "Framework diagnostic, not a paper number. The current run's largest companion root is slightly above one (1.074), so the system is mildly explosive in this sample; Sims describes his system as very slowly damped (p. 21)"
    paper_value: 1.0
    paper_units: "modulus"
    our_key: "max_eig_modulus"
    tolerance: 0.10
    tolerance_kind: "absolute"

  # ---- Headline IRF claims (Cholesky, M1 ordered first) ----
  - description: "M1 own-shock impact response (h=0; Cholesky lower-triangular convention)"
    location: "Cholesky impact = positive diagonal element by construction"
    paper_value: 1.0
    paper_units: "indicator (1.0 = positive, 0.0 = non-positive)"
    our_key: "m1_own_impact_positive"
    tolerance: 0.0
    tolerance_kind: "absolute"

  - description: "Real GDP response to M1 shock at h=4 (positive; Sims's headline: monetary stimulus raises output temporarily)"
    location: "Regression baseline from an earlier run of this replication (1959Q1-1975Q4, trend=ct), not a paper number; sign checked against Sims's Appendix II chart 'U.S. Responses of Y', p. 37"
    paper_value: 0.0024
    paper_units: "log-units (log real GDP)"
    our_key: "rgdp_to_m1_h4"
    tolerance: 0.003
    tolerance_kind: "absolute"

  - description: "Deflator response to M1 shock at h=12 (positive; Sims's headline: price level rises persistently after monetary shock)"
    location: "Regression baseline from an earlier run of this replication (1959Q1-1975Q4, trend=ct), not a paper number; sign checked against Sims's Appendix II chart 'U.S. Responses of P', p. 39"
    paper_value: 0.0050
    paper_units: "log-units (log deflator)"
    our_key: "deflator_to_m1_h12"
    tolerance: 0.003
    tolerance_kind: "absolute"
