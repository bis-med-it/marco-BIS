name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-suite:
    name: fast suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run fast test suite
        # The FRED-MD/QD CSVs are not distributed; data-dependent tests
        # skip with a pointer to data/*/UPDATE.md. Slow replication smoke
        # tests run locally via --runslow.
        run: python -m pytest tests/ -q
